version: 2
updates:
  - package-ecosystem: "cargo"
    open-pull-requests-limit: 5
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 5
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

